[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oui"
version = "0.1.0"
description = "Provider-agnostic agentic coding shell"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "litellm>=1.0",
]

[project.scripts]
oui = "wi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wi"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
